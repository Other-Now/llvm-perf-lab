name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 20 (Ubuntu noble-updates)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-20-dev llvm-20-tools clang-20 ninja-build
      - name: Build plugin, lit, differential test
        env:
          LLVM_ROOT: /usr/lib/llvm-20
        run: bash scripts/test.sh 200000
